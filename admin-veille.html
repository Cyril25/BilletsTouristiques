<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://drive.google.com https://drive.usercontent.google.com https://lh3.googleusercontent.com https://res.cloudinary.com; connect-src 'self' https://www.gstatic.com https://lhwcoybugdsggcclhtgb.supabase.co https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://accounts.google.com https://api.cloudinary.com https://billet-proxy-worker.cyril-samson41.workers.dev; frame-src 'self' https://asso-billet-site.firebaseapp.com https://apis.google.com https://accounts.google.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comptes inactifs — mise en veille des comptes qui ne viennent plus (administration).">
    <title>Comptes inactifs - BilletsTouristiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <!-- Demande #54 : pose le theme AVANT le premier rendu. global.js se charge en fin
         de corps ; y mettre cette ligne ferait clignoter le blanc a chaque page. -->
    <script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-require-admin="true">
    <div id="menu-placeholder"></div>
    <div id="app-content" style="display:none">

        <div class="admin-page-header">
            <h1><i class="fa-solid fa-bed"></i> Comptes inactifs</h1>
        </div>

        <div class="veille-page">
            <!-- Demande #72 — les réglages : durée, rappel, interrupteur -->
            <section class="veille-reglages" aria-labelledby="veille-reglages-titre">
                <h2 id="veille-reglages-titre"><i class="fa-solid fa-sliders"></i> Réglages</h2>
                <div id="veille-etat" class="veille-etat"></div>
                <form id="veille-reglages-form" class="veille-reglages-form" onsubmit="event.preventDefault(); veilleEnregistrerReglages();">
                    <label class="veille-champ">
                        <span>Mise en veille après</span>
                        <select id="veille-delai">
                            <option value="3">3 mois</option>
                            <option value="6">6 mois</option>
                            <option value="9">9 mois</option>
                            <option value="12">12 mois</option>
                            <option value="18">18 mois</option>
                            <option value="24">24 mois</option>
                            <option value="36">36 mois</option>
                        </select>
                        <span>sans visite</span>
                    </label>
                    <label class="veille-champ">
                        <span>Rappel par mail</span>
                        <input type="number" id="veille-rappel" min="7" max="90" step="1" inputmode="numeric">
                        <span>jours avant</span>
                    </label>
                    <label class="veille-interrupteur">
                        <input type="checkbox" id="veille-active">
                        <span>Mise en veille allumée</span>
                    </label>
                    <button type="submit" class="user-modal-btn user-modal-btn-primary" id="veille-reglages-btn">
                        <i class="fa-solid fa-floppy-disk"></i> Enregistrer
                    </button>
                </form>
                <p id="veille-reglages-modif" class="veille-note"></p>
            </section>

            <div class="admin-tabs veille-onglets" role="tablist">
                <button id="veille-tab-bientot" class="admin-tab active" onclick="veilleChangerOnglet('bientot')">Bientôt en veille <span id="veille-count-bientot" class="admin-tab-count">0</span></button>
                <button id="veille-tab-retenus" class="admin-tab" onclick="veilleChangerOnglet('retenus')">Retenus <span id="veille-count-retenus" class="admin-tab-count">0</span></button>
                <button id="veille-tab-en_veille" class="admin-tab" onclick="veilleChangerOnglet('en_veille')">En veille <span id="veille-count-en_veille" class="admin-tab-count">0</span></button>
                <button id="veille-tab-journal" class="admin-tab" onclick="veilleChangerOnglet('journal')">Historique</button>
            </div>

            <div id="veille-actions" class="veille-actions"></div>
            <div id="veille-contenu">
                <p class="veille-vide">Chargement...</p>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" integrity="sha384-v3Z/Xdw1sCeo6M/geW7sn1Lt9obIm7MhAk8laVV+rvYFmzuWDELOiygx7dVte2dX" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" integrity="sha384-p62xBRve8PdqGDGASZtZMuHgPsyPcT5VsFwgmz2p4zaFdEtt5ZzNqxK+CLzQS7xP" crossorigin="anonymous"></script>
    <script src="global.js"></script>
    <script src="admin-veille.js"></script>
</body>
</html>
